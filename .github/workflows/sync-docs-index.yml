name: Sync docs/index.md from README

on:
  push:
    branches: [develop]
    paths:
      - 'README.md'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - name: Generate docs/index.md
        run: python3 scripts/build_docs_index.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.md
          git diff --cached --quiet || git commit -m "chore: sync docs/index.md from README.md [skip ci]"
          git push

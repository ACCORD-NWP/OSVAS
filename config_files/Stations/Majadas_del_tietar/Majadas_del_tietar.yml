OSVAS_steps:
 Create_forcing: false
 Get_validation: false
 Run_surfex: false
 Surfex_steps: #Don't forget a space before each item
  - pgd
  - PREP
  - OFFLINE
 Expnames: #Don't forget a space before each item
    - DIFMEB_v9
    - DIFMEB_v9_LN3
    - DIFMEB_v9_LN3_Kr
    - DIFMEB_v9_LN3_Kr_b
    - DIFMEB_v9_LN3_Kr_b_FCWP
    - DIFMEB_v9_plusDSL
 Extract_model_sqlites: false
 Run_HARP: true
 Display_HARP: false

Station_metadata:
  Station_type: ICOS
  Station_name: Majadas_del_tietar
  SID: 4300000005
  elev: 265.0
  lat: 39.94033
  lon: -5.77465
  vegtype: 10
  canopy_storage: false
  closure_type: 2
  estimate_albedo: true  # If true, estimate NIR and VIS albedos from validation data (SW_OUT/SW_IN 11:00-13:00 UTC)
  estimate_lai: true    # If true, estimate monthly LAIs from Copernicus' Sentinel LAI data
  
Forcing_data:
  height_T: 8.0                       # Height of the temperature measurement
  height_V: 15.6                      # Height of the windspeed   measurement
  run_start: '2023-11-01 00:00:00'    # Timestamp for the forcing start
  run_end: '2024-12-31 23:30:00'      # Timestamp for the forcing end
  forcing_format: 'ascii'          # Choose between netcdf or ascii
  dataset1:
    doi: https://meta.icos-cp.eu/objects/ei48butWy0H0b12KOZy2njyw
    timedelta: 30  # in minutes
    variables:
      Forc_CO2: -, 0.00062
      Forc_PS: PA, *1000
      Forc_RAIN: P, /(timedelta*60)
      Forc_SNOW: 
      Forc_WIND: WS
      Forc_DIR: WD      
      Forc_DIR_SW: SW_IN
      Forc_LW: LW_IN
      Forc_QA: 
      Forc_SCA_SW: 
      Forc_TA: TA, +273.15
      Forc_RH: RH
Validation_data:
  validation_start: '2024-1-1 00:00:00'
  validation_end: '2024-12-31 23:00:00'
  common_obstable: true
  common_fctable: true
  dataset1: 
    doi: https://meta.icos-cp.eu/objects/ei48butWy0H0b12KOZy2njyw
    timedelta: 30
    variables: # Map ICOS variables (right) to a name (left) in the OBSTABLE
      SW_OUT: SW_OUT
      LW_OUT: LW_OUT
      SW_IN: SW_IN
      LW_IN: LW_IN  
      TS_*: TS_*
      SWC_*: SWC_*
    units:  # If compatible, these should be similar to units attribute in output netcdf files. Otherwise a conversion in set_params.R will be needed
      SW_OUT: W/m2
      LW_OUT: W/m2
      LW_IN: W/m2
      SW_IN: W/m2
      TS_*: degC
      SWC_*: percent
  dataset2:
    doi: https://meta.icos-cp.eu/objects/V8Wjs15Fj0aDX1xmiNx2zPA-
    timedelta: 30
    variables:
      H: H
      LE: LE
      TAU: TAU
      USTAR: USTAR
    units:
      H: W/m2
      LE: W/m2
      TAU: Pa
      USTAR: m/s
  dataset3:
    doi: https://meta.icos-cp.eu/objects/bSceGKFPYtSyRgGxAqmfq_DF
    timedelta: 30
    variables:
      RH_diag : RH_2_1_1  #Nominally 1.8m
      T_diag  : TA_2_1_1  #Nominally 1.8m
      T_diag  : WS_1_1_1  #Nominally 15.6m (consistency check)
    units: 
      RH_diag: percent
      T_diag: degC
      V_diag: m/s
Initialization_data: 
  initialization_start: '2020-01-01 00:00:00'
  initialization_end: '2025-12-31 23:00:00'
  metadata_filename: 'ICOSETC_ES-LMa_VARINFO_METEO_L2.csv'
  reuse_soil_profile: false
  Init_to_namelist: true   # patch OPTIONS.nam for each expname - Only for SURFEX v9 namelists
  Init_to_prep: false       # patch PREP.txt or PREP.nc for each expname

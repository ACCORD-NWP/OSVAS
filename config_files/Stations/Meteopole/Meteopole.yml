OSVAS_steps:
 Create_forcing: false
 Get_validation: false
 Run_surfex: false
 Surfex_steps: #Don't forget a space before each item
  - pgd
  - PREP
  - OFFLINE
 Expnames: #Don't forget a space before each item
  - DIFMEB_v9
  - DIFMEB_v9_lin02
#  - DIFMEB_v9_lin04
#  - DIFMEB_v9_lin06
#  - DIFMEB_v9_lin08
 Extract_model_sqlites: true
 Run_HARP: true
 Display_HARP: false

Station_metadata:
  Station_type: ICOS
  Station_name: Meteopole
  SID: 4300000006
  elev: 158
  lat: 43.572857
  lon: 1.37474
  vegtype: 10
  lai: 1.85,1.50,1.72,2.35,2.15,1.37,1.3,1.25,1.37,1.45,1.3,1.25
  estimate_albedo: true  # If true, estimate NIR and VIS albedos from validation data (SW_OUT/SW_IN 11:00-13:00 UTC)
  estimate_lai: true    # If true, estimate monthly LAIs from Copernicus' Sentinel LAI data
  
Forcing_data:
  height_T: 2                       # Height of the temperature measurement
  height_V: 10                      # Height of the windspeed   measurement
  run_start: '2022-11-01 00:00:00'    # Timestamp for the forcing start
  run_end: '2023-12-31 23:30:00'      # Timestamp for the forcing end
  forcing_format: 'netcdf'          # Choose between netcdf or ascii
  dataset1:
    doi: https://meta.icos-cp.eu/objects/ClxZ0M4-XC0WevhDm_cO2LeA
    timedelta: 30  # in minutes
    variables:
      Forc_CO2: -, 0.00062
      Forc_PS: PA, *1000
      Forc_RAIN: P, /(timedelta*60)
      Forc_SNOW: 
      Forc_WIND: WS
      Forc_DIR: WD      
      Forc_DIR_SW: SW_IN
      Forc_LW: LW_IN
      Forc_QA: 
      Forc_SCA_SW: 
      Forc_TA: TA, +273.15
      Forc_RH: RH
Validation_data:
  validation_start: '2023-1-1 00:00:00'
  validation_end: '2023-12-31 23:00:00'
  common_obstable: false
  common_fctable: false
  dataset1: 
    doi: https://meta.icos-cp.eu/objects/ClxZ0M4-XC0WevhDm_cO2LeA
    timedelta: 30
    variables: # Map ICOS variables (right) to a name (left) in the OBSTABLE
      SW_OUT: SW_OUT
      LW_OUT: LW_OUT
      SW_IN: SW_IN
      LW_IN: LW_IN  
      TS_*: TS_*
      SWC_*: SWC_*
      G: G
    units:  # If compatible, these should be similar to units attribute in output netcdf files. Otherwise a conversion in set_params.R will be needed
      SW_OUT: W/m2
      LW_OUT: W/m2
      LW_IN: W/m2
      SW_IN: W/m2
      TS_*: degC
      SWC_*: percent
      G: W/m2
  dataset2: 
    doi: https://meta.icos-cp.eu/objects/No7s1uuHhY2frqKUg6CSIRV-
    timedelta: 30
    variables:
      H: H_F_MDS
      LE: LE_F_MDS
      VPD: VPD_F
      NEE: NEE_VUT_REF
    units:
      H: W/m2
      LE: W/m2
      VPD: hPa 
      NEE: W/m2

Initialization_data:
  initialization_start: '2020-01-01 00:00:00'
  initialization_end: '2025-12-31 23:30:00'
  metadata_filename: 'ICOSETC_FR-Tou_VARINFO_METEO_L2.csv'
  reuse_soil_profile: false
  Init_to_namelist: false   # patch OPTIONS.nam for each expname - Only for SURFEX v9 namelists
  Init_to_prep: true       # patch PREP.txt or PREP.nc for each expname

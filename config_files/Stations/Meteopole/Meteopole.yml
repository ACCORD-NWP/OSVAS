OSVAS_steps:
 Create_forcing: false
 Get_validation: false
 Run_surfex: true
 Surfex_steps: #Don't forget a space before each item
  - pgd
  - PREP
  - OFFLINE
 Expnames: #Don't forget a space before each item
  - DIF_v9
  - DIFMEB_v9
 Extract_model_sqlites: false
 Run_HARP: false
 Display_HARP: false

Station_metadata:
  Station_name: Meteopole
  SID: 4300000006
  elev: 158
  lat: 43.572857
  lon: 1.37474
  vegtype: 10
  lai: 1.85,1.50,1.72,2.35,2.15,1.37,1.3,1.25,1.37,1.45,1.3,1.25

Forcing_data:
  height_T: 2                       # Height of the temperature measurement
  height_V: 10                      # Height of the windspeed   measurement
  run_start: '2020-05-01 00:00:00'    # Timestamp for the forcing start
  run_end: '2020-07-31 23:30:00'      # Timestamp for the forcing end
  forcing_format: 'netcdf'          # Choose between netcdf or ascii
  dataset1:
    doi: https://meta.icos-cp.eu/objects/VIoR-cJnMUUjbaEkuNHMKgSv
    timedelta: 30  # in minutes
    variables:
      Forc_CO2: -, 0.00062
      Forc_PS: PA, *1000
      Forc_RAIN: P, /(timedelta*60)
      Forc_SNOW: 
      Forc_WIND: WS
      Forc_DIR: WD      
      Forc_DIR_SW: SW_IN
      Forc_LW: LW_IN
      Forc_QA: 
      Forc_SCA_SW: 
      Forc_TA: TA, +273.15
      Forc_RH: RH
Validation_data:
  validation_start: '2020-05-01 00:00:00'
  validation_end: '2020-12-31 23:30:00'
  common_obstable: FALSE
  dataset1: 
    doi: https://meta.icos-cp.eu/objects/VIoR-cJnMUUjbaEkuNHMKgSv
    timedelta: 30
    variables: # Map ICOS variables (right) to a name (left) in the OBSTABLE
      SW_OUT: SW_OUT
      LW_OUT: LW_OUT
      SW_IN: SW_IN
      LW_IN: LW_IN  
      TS_*: TS_*
      SWC_*: SWC_*
      G: G
    units:  # If compatible, these should be similar to units attribute in output netcdf files. Otherwise a conversion in set_params.R will be needed
      SW_OUT: W/m2
      LW_OUT: W/m2
      LW_IN: W/m2
      SW_IN: W/m2
      TS_1: degC
      TS_2: degC
      TS_3: degC
      TS_4: degC
      TS_5: degC        
      SWC_1: percent
      SWC_2: percent
      SWC_3: percent
      SWC_4: percent
      SWC_5: percent
      G: W/m2
  dataset2: 
    doi: https://meta.icos-cp.eu/objects/No7s1uuHhY2frqKUg6CSIRV-
    timedelta: 30
    variables:
      H: H_F_MDS
      LE: LE_F_MDS
      VPD: VPD_F
      NEE: NEE_VUT_REF
    units:
      H: W/m2
      LE: W/m2
      VPD: hPa 
      NEE: W/m2

Initialization_data:
  initialization_start: '2018-03-02 00:00:00'
  initialization_end: '2023-03-01 23:30:00'
  metadata_filename: 'ICOSETC_FR-Tou_VARINFO_METEO_L2.csv'
  reuse_soil_profile: false

OSVAS_steps:
 Create_forcing: true
 Get_validation: false
 Run_surfex: true
 Surfex_steps: #Don't forget a space before each item
  - PGD
  - PREP
  - OFFLINE
 Expnames: #Don't forget a space before each item
  - BASECABAUW
 Extract_model_sqlites: true
 Run_HARP: false
 Display_HARP: false

Station_metadata:
  Station_type: KNMI
  Station_name: Cabauw
  SID: 4300000008
  elev: 0
  lat: 51.9703
  lon: 4.9264
  vegtype: 10

Forcing_data:
  height_T: 20                       # Height of the temperature measurement
  height_V: 20                      # Height of the windspeed   measurement
  run_start: '2017-12-01 00:00:00'    # Timestamp for the forcing start
  run_end: '2017-12-31 23:59:00'      # Timestamp for the forcing end
  forcing_format: 'ascii'          # Choose between netcdf or ascii
  dataset1:
    doi: https://api.dataplatform.knmi.nl/open-data/v1/datasets/cesar_surface_meteo_lc1_t10/versions/v1.0/files/
    timedelta: 10  # in minutes
    variables:
      Forc_CO2: -, 0.00062
      Forc_PS: P0, *100
      Forc_RAIN: RAIN, /(timedelta*60)
      Forc_SNOW: 
  dataset2:
    doi: https://api.dataplatform.knmi.nl/open-data/v1/datasets/cesar_surface_radiation_lc1_t10/versions/v1.0/files/
    timedelta: 10
    variables:
      Forc_LW: LWD
      Forc_DIR_SW: SWD
      Forc_SCA_SW:
  dataset3: 
    doi: https://api.dataplatform.knmi.nl/open-data/v1/datasets/cesar_tower_meteo_lb1_t10/versions/v1.2/files #Deprecated update to v1.3 when files are available
    timedelta: 10
    variables:
      Forc_WIND: F
      Forc_DIR: D      
      Forc_QA: Q, /1000
      Forc_TA: TA
    
Validation_data:
  validation_start: '2017-11-01 00:00:00'
  validation_end: '2018-01-31 23:59:00'
  common_obstable: FALSE  # Write obs to a common obstable or to a single-station one
  dataset1: 
    doi: https://api.dataplatform.knmi.nl/open-data/v1/datasets/cesar_surface_radiation_lc1_t10/versions/v1.0/files
    timedelta: 10
    variables: # Map Cesar variables (right) to a name (left) in the OBSTABLE
      SW_OUT: SWU
      LW_OUT: LWU
      SW_IN: SWD
      LW_IN: LWD 
    units:  # If compatible, these should be similar to units attribute in output netcdf files. Otherwise a conversion in set_params.R will be needed
      SW_OUT: W/m2
      LW_OUT: W/m2
      LW_IN: W/m2
      SW_IN: W/m2
  dataset2:
    doi: https://api.dataplatform.knmi.nl/open-data/v1/datasets/cesar_surface_flux_lc1_t10/versions/v1.0/files
    timedelta: 10
    variables:
      H: H
      LE: LE
    units:
      H: W/m2
      LE: W/m2
  dataset3:
    doi: https://api.dataplatform.knmi.nl/open-data/v1/datasets/cesar_soil_heat_lb1_t10/versions/v1.0/files
    timedelta: 10
    type: profile #This type will interpolate the values of the observations to the levels of the model
    variables:
      TS_1: 0.01 # Model Variable : depth (m)
      TS_2: 0.04
      TS_3: 0.10
      TS_4: 0.20
      TS_5: 0.40
      TS_6: 0.60
    observations: #observaion variables: depth(m)
      TS00: 0.00
      TS02: 0.02
      TS04: 0.04
      TS06: 0.06
      TS08: 0.08
      TS12: 0.12
      TS20: 0.20
      TS30: 0.30
      TS50: 0.50
    units:
      TS_1: degC
      TS_2: degC
      TS_3: degC
      TS_4: degC
      TS_5: degC
      TS_6: degC
  
  dataset4:
    doi: https://api.dataplatform.knmi.nl/open-data/v1/datasets/cesar_soil_water_lb1_t10/versions/v1.1/files
    timedelta: 10
    type: profile
    variables:
      SWC_2: 0.04
      SWC_3: 0.10
      SWC_4: 0.20
      SWC_5: 0.40
      SWC_6: 0.60
    observations:
      TH05: 0.05
      TH19: 0.19
      TH33: 0.33
      TH40: 0.40
      TH56: 0.56
    units:
      SWC_2: m3/m3
      SWC_3: m3/m3
      SWC_4: m3/m3
      SWC_5: m3/m3
      SWC_6: m3/m3

  dataset5:
    doi: https://api.dataplatform.knmi.nl/open-data/v1/datasets/cesar_surface_meteo_lc1_t10/versions/v1.0/files/
    timedelta: 10
    variables:
      T2m: TA002
      Q2m: Q002
      S10m: F010
    units:
      T2m: K
      Q2m: g/Kg
      S10m: m/s

Initialization_data:
  initialization_start: '2016-01-01 00:00:00'
  initialization_end: '2020-12-31 23:30:00'
  reuse_soil_profile: false
  Init_to_namelist: false   # patch OPTIONS.nam for each expname - Only for SURFEX v9 namelists
  Init_to_prep: false       # patch PREP.txt or PREP.nc for each expname
  soil_depths_ts: [0, 0.02, 0.04, 0.06, 0.08, 0.12, 0.2, 0.3, 0.5] # These will be read first; if absent, they're extracted from metadata file
  soil_depths_swc: [0.04, 0.10, 0.20, 0.40, 0.60] #These will be read first; if absent, they're extracted from metadata file

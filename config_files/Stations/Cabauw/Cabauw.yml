OSVAS_steps:
 Create_forcing: false
 Get_validation: true
 Run_surfex: false
 Surfex_steps: #Don't forget a space before each item
  - pgd
  - PREP
  - OFFLINE
 Expnames: #Don't forget a space before each item
    - DIFMEB_v9
    - DIFMEB_v9_LN3
    - DIFMEB_v9_LN3_Kr
    - DIFMEB_v9_LN3_Kr_b
    - DIFMEB_v9_LN3_Kr_b_FCWP
    - DIFMEB_v9_plusDSL
 Extract_model_sqlites: false
 Run_HARP: false
 Display_HARP: false

Station_metadata:
  Station_type: KNMI
  Station_name: Cabauw
  SID: 4300000008
  elev: 0
  lat: 51.9703
  lon: 4.9264
  vegtype: 10
  canopy_storage: false
  closure_type: 2
  estimate_albedo: true  # If true, estimate NIR and VIS albedos from validation data (SW_OUT/SW_IN 11:00-13:00 UTC)
  estimate_lai: true    # If true, estimate monthly LAIs from Copernicus' Sentinel LAI data
  
Forcing_data:
  height_T: 20                       # Height of the temperature measurement
  height_V: 20                      # Height of the windspeed   measurement
  run_start: '2018-11-01 00:00:00'    # Timestamp for the forcing start
  run_end: '2019-12-31 23:30:00'      # Timestamp for the forcing end
  forcing_format: 'ascii'          # Choose between netcdf or ascii
  dataset1:
    doi: https://api.dataplatform.knmi.nl/open-data/v1/datasets/cesar_surface_meteo_lc1_t10/versions/v1.0/files/
    timedelta: 10  # in minutes
    variables:
      Forc_CO2: -, 0.00062
      Forc_PS: P0, *100
      Forc_RAIN: RAIN, /(timedelta*60)
      Forc_SNOW: 
  dataset2:
    doi: https://api.dataplatform.knmi.nl/open-data/v1/datasets/cesar_surface_radiation_lc1_t10/versions/v1.0/files/
    timedelta: 10
    variables:
      Forc_LW: LWD
      Forc_DIR_SW: SWD
      Forc_SCA_SW:
  dataset3: 
    doi: https://api.dataplatform.knmi.nl/open-data/v1/datasets/cesar_tower_meteo_lb1_t10/versions/v1.2/files #Deprecated update to v1.3 when files are available
    timedelta: 10
    variables:
      Forc_WIND: F
      Forc_DIR: D      
      Forc_QA: Q, /1000
      Forc_TA: TA
    
Validation_data:
  validation_start: '2019-1-1 00:00:00'
  validation_end: '2024-12-31 23:00:00'
  common_obstable: true
  common_fctable: true
  dataset1: 
    doi: https://api.dataplatform.knmi.nl/open-data/v1/datasets/cesar_surface_radiation_lc1_t10/versions/v1.0/files
    timedelta: 10
    variables: # Map Cesar variables (right) to a name (left) in the OBSTABLE
      SW_OUT: SWU
      LW_OUT: LWU
      SW_IN: SWD
      LW_IN: LWD 
    units:  # If compatible, these should be similar to units attribute in output netcdf files. Otherwise a conversion in set_params.R will be needed
      SW_OUT: W/m2
      LW_OUT: W/m2
      LW_IN: W/m2
      SW_IN: W/m2
  dataset2:
    doi: https://api.dataplatform.knmi.nl/open-data/v1/datasets/cesar_surface_flux_lc1_t10/versions/v1.0/files
    timedelta: 10
    variables:
      H: H
      LE: LE
      G: G
      USTAR : UST
    units:
      H: W/m2
      LE: W/m2
      G: W/m2
    USTAR: m/s
  dataset3:
    doi: https://api.dataplatform.knmi.nl/open-data/v1/datasets/cesar_soil_heat_lb1_t10/versions/v1.0/files
    timedelta: 10
    variables:
      TS_1: TS00
      TS_2: TS02
      TS_3: TS04
      TS_4: TS06
      TS_5: TS08
      TS_6: TS12
      TS_7: TS20
      TS_8: TS30
      TS_9: TS50    
    units:
      TS_1: degC
      TS_2: degC
      TS_3: degC
      TS_4: degC
      TS_5: degC
      TS_6: degC
      TS_7: degC
      TS_8: degC
      TS_9: degC
          
  dataset4:
    doi: https://api.dataplatform.knmi.nl/open-data/v1/datasets/cesar_soil_water_lb1_t10/versions/v1.1/files
    timedelta: 10
    type: profile
    variables:
            #SWC_1: TH03  #0.04
            #SWC_2: TH05  #0.05
      SWC_1: TH19  #0.19
      SWC_2: TH33  #0.33
      SWC_3: TH40  #0.40
      SWC_4: TH56  #0.56
    units:
      SWC_1: m3/m3
      SWC_2: m3/m3
      SWC_3: m3/m3
      SWC_4: m3/m3
      SWC_5: m3/m3
      SWC_6: m3/m3

  dataset5:
    doi: https://api.dataplatform.knmi.nl/open-data/v1/datasets/cesar_surface_meteo_lc1_t10/versions/v1.0/files/
    timedelta: 10
    variables:
      T_diag: TA002
      Q_diag: Q002
      V_diag: F010
    units:
      T_diag: K
      Q_diag: g/Kg
      V_diag: m/s

Initialization_data:
  initialization_start: '2017-01-01 00:00:00'
  initialization_end: '2021-12-31 23:00:00'
  reuse_soil_profile: false
  Init_to_namelist: true   # patch OPTIONS.nam for each expname - Only for SURFEX v9 namelists
  Init_to_prep: false       # patch PREP.txt or PREP.nc for each expname
  soil_depths_ts: [0, 0.02, 0.04, 0.06, 0.08, 0.12, 0.2, 0.3, 0.5] # These will be read first; if absent, they're extracted from metadata file
  soil_depths_swc: [ 0.19, 0.33, 0.40, 0.56] #These will be read first; if absent, they're extracted from metadata file


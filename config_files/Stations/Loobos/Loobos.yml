OSVAS_steps:
 Create_forcing: false
 Get_validation: false
 Run_surfex: false
 Surfex_steps: #Don't forget a space before each item
  - pgd
  - PREP
  - OFFLINE
 Expnames: #Don't forget a space before each item
  - DIFMEB_PUREOFFLINE
 Extract_model_sqlites: false
 Run_HARP: false
 Display_HARP: true

Station_metadata:
  Station_name: Loobos
  SID: 4300000007
  elev: 33
  lat: 52.166447
  lon: 5.74355
  vegtype: 15
  lai: 1.9,1.9,1.9,1.9,1.9,1.9,1.9,1.9,1.9,1.9,1.9,1.9
  closure_type: 1

Forcing_data:
  height_T: 38.2  # Height of the temperature measurement https://maq-observations.nl/operational-data/
  height_V: 38.2  # Height of the windspeed   measurement https://maq-observations.nl/operational-data/
  run_start: '2024-5-30 23:00:00'    # Timestamp for the forcing start
  run_end: '2024-7-31 00:00:00'      # Timestamp for the forcing end
  forcing_format: 'ascii'          # Choose between netcdf or ascii
  dataset1:
    doi: https://meta.icos-cp.eu/objects/QfstRcIlaOI5kNIgBhSCKinI
    timedelta: 30  # in minutes
    variables:
      Forc_CO2: -, 0.00062
      Forc_PS: PA, *1000
      Forc_RAIN: P, /(timedelta*60)
      Forc_SNOW: 
      Forc_WIND: WS_1
      Forc_DIR: WD_1    
      Forc_DIR_SW: SW_IN
      Forc_LW: LW_IN
      Forc_QA: 
      Forc_SCA_SW: 
      Forc_TA: TA_1, +273.15
      Forc_RH: RH
  dataset2:
    doi: https://meta.icos-cp.eu/objects/QfstRcIlaOI5kNIgBhSCKinI
    timedelta: 30  # in minutes
    variables:
      Forc_VPD: VPD
Validation_data:
  validation_start: '2024-5-30 00:00:00'
  validation_end: '2024-7-31 23:00:00'
  common_obstable: FALSE
  dataset1: 
    doi: https://meta.icos-cp.eu/objects/QfstRcIlaOI5kNIgBhSCKinI
    timedelta: 30
    variables: # Map ICOS variables (right) to a name (left) in the OBSTABLE
      SW_OUT: SW_OUT
      LW_OUT: LW_OUT
      SW_IN: SW_IN
      LW_IN: LW_IN  
      TS_*: TS_*
      SWC_*: SWC_*
      G: G_2
    units:  # If compatible, these should be similar to units attribute in output netcdf files. Otherwise a conversion in set_params.R will be needed
      SW_OUT: W/m2
      LW_OUT: W/m2
      LW_IN: W/m2
      SW_IN: W/m2
      TS_*: degC
      SWC_*: percent
      G: W/m2
  dataset2: 
    doi: https://meta.icos-cp.eu/objects/v7pbR5OY2J4fAvWuLvmxj0ac
    timedelta: 30
    variables:
      H: H_F_MDS
      LE: LE_F_MDS
      VPD: VPD_F
      NEE: NEE_VUT_REF
    units:
      H: W/m2
      LE: W/m2
      VPD: hPa 
      NEE: W/m2
Initialization_data: 
  initialization_start: '2023-6-1 00:00:00'
  initialization_end: '2025-12-31 23:00:00'
  metadata_filename: 'ICOSETC_NL-Loo_VARINFO_METEO_L2.csv'
  reuse_soil_profile: false
  Init_to_namelist: false   # patch OPTIONS.nam for each expname - Only for SURFEX v9 namelists
  Init_to_prep: true   # patch PREP.txt or PREP.nc for each expname


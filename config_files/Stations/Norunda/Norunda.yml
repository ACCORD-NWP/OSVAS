OSVAS_steps:
 Create_forcing: false
 Get_validation: false
 Run_surfex: false
 Surfex_steps: #Don't forget a space before each item
  - pgd
  - PREP
  - OFFLINE
 Expnames: #Don't forget a space before each item
   - FRACC_origbr
   - DIFMEBACC_origbr
 Extract_model_sqlites: false
 Run_HARP: false
 Display_HARP: true
 
Station_metadata:
  Station_type: ICOS
  Station_name: Norunda
  SID: 4300000004
  elev: 46.0
  lat: 60.0865
  lon: 17.479504
  vegtype: 5
  canopy_storage: true
  closure_type: 0
  estimate_albedo: false  # If true, estimate NIR and VIS albedos from validation data (SW_OUT/SW_IN 11:00-13:00 UTC)
  estimate_lai: false     # If true, estimate monthly LAIs from Copernicus' Sentinel LAI data
  Tree_height: 25.0
  diag_T: 32.0   # AGL height of temperature diagnostic
  diag_RH: 32.0   # AGL height of humidity diagnostic
  diag_V: 32.0   # AGL height of wind diagnostic
Forcing_data:
  height_T: 58.0  # Height of the temperature measurement https://maq-observations.nl/operational-data/
  height_V: 58.0  # Height of the windspeed   measurement https://maq-observations.nl/operational-data/
  run_start: '2021-05-15 00:00:00'    # Timestamp for the forcing start
  run_end: '2021-09-30 23:30:00'      # Timestamp for the forcing end
  forcing_format: 'ascii'          # Choose between netcdf or ascii
  dataset1:
    doi: https://meta.icos-cp.eu/objects/pq_ziUZiYyoYKne9HMTbkfJr
    timedelta: 30  # in minutes
    variables:
      Forc_CO2: -, 0.00062
      Forc_SNOW: 
      Forc_DIR_SW: SW_IN
      Forc_LW: LW_IN
      Forc_QA: 
      Forc_SCA_SW: 
      Forc_TA: TA_4, +273.15
      Forc_PS: PA, *1000
      Forc_RAIN: P, /(timedelta*60)   
  dataset2:
    doi: https://meta.icos-cp.eu/objects/U3fNQUj34MhLD22CRC3LhZIY
    timedelta: 60  # in minutes
    variables:
      Forc_RH: RH
      Forc_WIND: WS
      Forc_DIR: WD          
